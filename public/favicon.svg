<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tokenflowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Gradient Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#tokenflowGradient)" filter="url(#shadow)" />

  <!-- Modern Ticket Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ticket Contour with Cutouts -->
    <path d="M 120 160 C 120 138 138 120 160 120 L 352 120 C 374 120 392 138 392 160 L 392 216 C 370 216 370 296 392 296 L 392 352 C 392 374 374 392 352 392 L 160 392 C 138 392 120 374 120 352 L 120 296 C 142 296 142 216 120 216 Z" fill="#ffffff" fill-opacity="0.12" />
    
    <!-- Perforated Line -->
    <line x1="256" y1="160" x2="256" y2="352" stroke-dasharray="20 20" stroke-opacity="0.75" />
  </g>

  <!-- Center Monogram 'T' Accent -->
  <path d="M 184 212 L 232 212 M 208 212 L 208 300" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="312" cy="256" r="24" fill="#ffffff" />
</svg>
